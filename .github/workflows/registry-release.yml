name: Build public Sockseek image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  sockseek:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify plugin contracts
        run: |
          python3 tools/plugins.py validate
          python3 -m unittest discover -s tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and record the immutable image
        run: |
          version=$(jq -r .version plugins/sockseek/manifest.json)
          package="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/listening-public-sockseek"
          tag="$package:$version-amd64-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 tools/plugins.py build sockseek --arch amd64 --tag "$tag" --push
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | jq -er .)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'sockseek/amd64=%s@%s\n' "$package" "$digest" > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-sockseek-amd64
          path: image.txt
          if-no-files-found: error
