name: Build public plugin images
on:
  push:
    branches: [codex/public-registry-build]
permissions:
  contents: read
  packages: write
jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { plugin: example-catalog, arch: amd64, runner: ubuntu-24.04 }
          - { plugin: example-catalog, arch: arm64, runner: ubuntu-24.04-arm }
          - { plugin: sockseek, arch: amd64, runner: ubuntu-24.04 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2485aa6784c7908512b836db4c7b35b04b1d85e7
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and record the immutable image
        env:
          PLUGIN: ${{ matrix.plugin }}
          ARCH: ${{ matrix.arch }}
        run: |
          version=$(jq -r .version "plugins/$PLUGIN/manifest.json")
          package="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/listening-public-$PLUGIN"
          tag="$package:$version-$ARCH"
          python3 tools/plugins.py build "$PLUGIN" --arch "$ARCH" --tag "$tag" --push
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | jq -er .)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s/%s=%s@%s\n' "$PLUGIN" "$ARCH" "$package" "$digest" > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.plugin }}-${{ matrix.arch }}
          path: image.txt
          if-no-files-found: error
