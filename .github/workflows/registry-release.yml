name: Build public plugin images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  plugin:
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - {id: sockseek, arch: amd64, runner: ubuntu-24.04}
          - {id: example-catalog, arch: amd64, runner: ubuntu-24.04}
          - {id: example-catalog, arch: arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify plugin contracts
        run: |
          python3 tools/plugins.py validate
          python3 -m unittest discover -s tests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and record the immutable image
        env:
          PLUGIN_ID: ${{ matrix.id }}
          PLUGIN_ARCH: ${{ matrix.arch }}
        run: |
          version=$(jq -r .version "plugins/$PLUGIN_ID/manifest.json")
          package="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/listening-public-$PLUGIN_ID"
          tag="$package:$version-$PLUGIN_ARCH-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3 tools/plugins.py build "$PLUGIN_ID" --arch "$PLUGIN_ARCH" --tag "$tag" --push
          digest=$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest.Digest}}' | jq -er .)
          [[ $digest =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s/%s=%s@%s\n' "$PLUGIN_ID" "$PLUGIN_ARCH" "$package" "$digest" > image.txt
      - uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.id }}-${{ matrix.arch }}
          path: image.txt
          if-no-files-found: error
